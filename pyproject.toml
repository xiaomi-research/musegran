[project]
name = "musegran"
version = "0.1.0"
description = "Multi-Granularity Conditioning with Music-Aware Position Encoding for Long-Form Music Generation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "MuseGran Authors" }]
keywords = ["music generation", "diffusion", "latent diffusion", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aeiou>=0.0.20",
    "alias-free-torch>=0.0.6",
    "auraloss>=0.4.0",
    "descript-audio-codec>=1.0.0",
    "einops>=0.7.0",
    "ema-pytorch>=0.2.3",
    "encodec>=0.1.1",
    "huggingface_hub",
    "k-diffusion>=0.1.1",
    "muq>=0.1.0",
    "pedalboard>=0.7.4",
    "pretty_midi>=0.2.10",
    "peft==0.15.0",
    "pydub>=0.25.0",
    "pyyaml>=6.0",
    "pytorch_lightning>=2.1.0",
    "safetensors",
    "sentencepiece>=0.1.99",
    "setuptools>=68",
    "torch>=2.2.0,<2.6.0",
    "torchaudio>=2.0.2,<2.6.0",
    "tqdm",
    "transformers==5.5.3",
    "wandb",
    "x-transformers>=1.25.0,<1.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
musegran-train = "train:main"
musegran-infer = "inference:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musegran"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
